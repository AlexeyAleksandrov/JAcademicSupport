<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EXP &amp; FC — Экспертные мнения и прогнозы</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .domain-badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; }
    .card { transition: box-shadow 0.15s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .conf-bar { transition: width 0.4s ease; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

<!-- Header -->
<header class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-4 shadow-sm flex-shrink-0">
  <div class="flex items-center gap-2">
    <div>
      <h1 class="text-lg font-bold text-gray-900 leading-tight">EXP &amp; FC — Экспертные мнения и прогнозы</h1>
      <p class="text-xs text-gray-500">Источники данных DST · Expert Opinions &amp; Foresight</p>
    </div>
  </div>
  <div class="ml-auto flex items-center gap-3">
    <a href="/dst.html" class="text-sm text-blue-600 hover:text-blue-800 flex items-center gap-1">
      ← DST Анализ
    </a>
  </div>
</header>

<!-- Tab switcher -->
<div class="bg-white border-b border-gray-200 px-6 flex gap-0 flex-shrink-0">
  <button id="tab-fc" onclick="showTab('fc')"
    class="px-5 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-600 transition-colors">
    Прогнозы (FC)
  </button>
  <button id="tab-exp" onclick="showTab('exp')"
    class="px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors">
    Экспертные мнения (EXP)
  </button>
</div>

<!-- Summary bar -->
<div id="summary-bar" class="bg-white border-b border-gray-100 px-6 py-2 flex items-center gap-6 text-xs text-gray-500">
  <span id="summary-total">Загрузка…</span>
</div>

<!-- Filter bar -->
<div class="bg-white border-b border-gray-100 px-6 py-2 flex items-center gap-3 flex-shrink-0">
  <input id="filter-input" type="text" placeholder="Поиск по навыку, домену, источнику…"
         class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 w-72 focus:outline-none focus:ring-2 focus:ring-blue-300"/>
  <select id="filter-domain" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none">
    <option value="">Все домены</option>
  </select>
  <select id="filter-direction" class="text-sm border border-gray-200 rounded-lg px-3 py-1.5 focus:outline-none">
    <option value="">Любое направление</option>
    <option value="POSITIVE">POSITIVE</option>
    <option value="NEGATIVE">NEGATIVE</option>
  </select>
  <span id="count-label" class="ml-auto text-gray-400"></span>
</div>

<!-- Content -->
<div id="content" class="flex-1 overflow-y-auto px-6 py-4">
  <div class="text-center py-16 text-gray-400">Загрузка…</div>
</div>

<script>
const DOMAIN_CONFIG = {
  BACKEND:      { label:'Backend',      bg:'bg-blue-100',    text:'text-blue-700' },
  FRONTEND:     { label:'Frontend',     bg:'bg-green-100',   text:'text-green-700' },
  DATABASE:     { label:'Database',     bg:'bg-orange-100',  text:'text-orange-700' },
  DEVOPS:       { label:'DevOps',       bg:'bg-purple-100',  text:'text-purple-700' },
  AI_ML:        { label:'AI/ML',        bg:'bg-red-100',     text:'text-red-700' },
  DATA_SCIENCE: { label:'Data Science', bg:'bg-teal-100',    text:'text-teal-700' },
  GENERAL:      { label:'General',      bg:'bg-gray-100',    text:'text-gray-600' },
  LANGUAGES:    { label:'Languages',    bg:'bg-violet-100',  text:'text-violet-700' },
  SYSTEMS:      { label:'Systems',      bg:'bg-yellow-100',  text:'text-yellow-700' },
  MOBILE:       { label:'Mobile',       bg:'bg-pink-100',    text:'text-pink-700' },
  SECURITY:     { label:'Security',     bg:'bg-rose-100',    text:'text-rose-700' },
  TESTING:      { label:'Testing',      bg:'bg-cyan-100',    text:'text-cyan-700' },
  CLOUD:        { label:'Cloud',        bg:'bg-sky-100',     text:'text-sky-700' },
  EMBEDDED:     { label:'Embedded',     bg:'bg-amber-100',   text:'text-amber-700' },
  BLOCKCHAIN:   { label:'Blockchain',   bg:'bg-indigo-100',  text:'text-indigo-700' },
  IOT:          { label:'IoT',          bg:'bg-lime-100',    text:'text-lime-700' },
  '1C':         { label:'1С',           bg:'bg-red-50',      text:'text-red-600' },
};
const D_DEF = { label:'—', bg:'bg-gray-50', text:'text-gray-400' };
const domainCfg = d => DOMAIN_CONFIG[d] || D_DEF;

function domainBadge(d) {
  if (!d) return '';
  const c = domainCfg(d);
  return `<span class="domain-badge ${c.bg} ${c.text} px-1.5 py-0.5 rounded">${c.label}</span>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function fetchJSON(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

let currentTab = 'fc';
let allItems = [];

function showTab(tab) {
  currentTab = tab;
  document.getElementById('tab-fc').className  = tab === 'fc'
    ? 'px-5 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-600 transition-colors'
    : 'px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
  document.getElementById('tab-exp').className = tab === 'exp'
    ? 'px-5 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-600 transition-colors'
    : 'px-5 py-3 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 transition-colors';
  loadData();
}

async function loadData() {
  document.getElementById('content').innerHTML = '<div class="text-center py-16 text-gray-400">Загрузка…</div>';
  document.getElementById('count-label').textContent = '';
  try {
    const url = currentTab === 'fc' ? '/api/foresights' : '/api/expert-opinions';
    allItems = await fetchJSON(url);
    populateDomainFilter(allItems);
    updateSummary(allItems);
    applyFilters();
  } catch(e) {
    document.getElementById('content').innerHTML = `<div class="text-center py-16 text-red-400">Ошибка загрузки: ${escHtml(e.message)}</div>`;
  }
}

function populateDomainFilter(items) {
  const domains = [...new Set(items.map(i => i.domain).filter(Boolean))].sort();
  const sel = document.getElementById('filter-domain');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Все домены</option>' +
    domains.map(d => {
      const cfg = domainCfg(d);
      return `<option value="${escHtml(d)}" ${d===cur?'selected':''}>${cfg.label || d}</option>`;
    }).join('');
}

function updateSummary(items) {
  const domains = [...new Set(items.map(i => i.domain).filter(Boolean))];
  if (currentTab === 'fc') {
    const sources = [...new Set(items.map(i => i.sourceName).filter(Boolean))];
    const avgConf = items.filter(i => i.confidence != null).reduce((s,i) => s + parseFloat(i.confidence), 0) / (items.length || 1);
    document.getElementById('summary-bar').innerHTML = `
      <span class="font-medium text-gray-700">Всего прогнозов: <span class="text-blue-600">${items.length}</span></span>
      <span>·</span>
      <span>Источников: <span class="font-medium">${sources.length}</span> (${sources.join(', ')})</span>
      <span>·</span>
      <span>Доменов: <span class="font-medium">${domains.length}</span></span>
      <span>·</span>
      <span>Средняя confidence: <span class="font-medium text-green-600">${avgConf.toFixed(3)}</span></span>
    `;
  } else {
    const experts = [...new Set(items.map(i => i.expertId).filter(Boolean))];
    const avgImp  = items.filter(i => i.skillImportance != null).reduce((s,i) => s + i.skillImportance, 0) / (items.length || 1);
    document.getElementById('summary-bar').innerHTML = `
      <span class="font-medium text-gray-700">Всего мнений: <span class="text-blue-600">${items.length}</span></span>
      <span>·</span>
      <span>Экспертов: <span class="font-medium">${experts.length}</span></span>
      <span>·</span>
      <span>Доменов: <span class="font-medium">${domains.length}</span></span>
      <span>·</span>
      <span>Средняя важность: <span class="font-medium text-green-600">${avgImp.toFixed(3)}</span></span>
    `;
  }
}

function applyFilters() {
  const q      = document.getElementById('filter-input').value.toLowerCase();
  const domain = document.getElementById('filter-domain').value;
  const dir    = document.getElementById('filter-direction').value;

  const filtered = allItems.filter(item => {
    if (domain && item.domain !== domain) return false;
    if (dir    && item.direction !== dir) return false;
    if (q) {
      const haystack = [
        item.sourceName, item.domain, item.techFamily,
        item.professionCode, item.direction,
        item.skillImportance, item.canonicalId
      ].map(v => String(v||'').toLowerCase()).join(' ');
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  document.getElementById('count-label').textContent = `${filtered.length} / ${allItems.length}`;

  if (currentTab === 'fc') {
    renderForesight(filtered);
  } else {
    renderExpert(filtered);
  }
}

// ── Render Foresight ──────────────────────────────────────────
function renderForesight(items) {
  if (!items.length) {
    document.getElementById('content').innerHTML = '<div class="text-center py-16 text-gray-400">Нет записей</div>';
    return;
  }

  // Group by sourceName
  const bySource = {};
  for (const item of items) {
    const src = item.sourceName || 'Без источника';
    if (!bySource[src]) bySource[src] = [];
    bySource[src].push(item);
  }

  const SOURCE_COLORS = {
    'WEF':          'bg-blue-50 border-blue-200',
    'Gartner':      'bg-purple-50 border-purple-200',
    'McKinsey':     'bg-green-50 border-green-200',
    'INZHENERKA':   'bg-orange-50 border-orange-200',
  };
  function sourceBg(src) {
    for (const [k, v] of Object.entries(SOURCE_COLORS)) {
      if (src.toUpperCase().includes(k.toUpperCase())) return v;
    }
    return 'bg-gray-50 border-gray-200';
  }

  document.getElementById('content').innerHTML = Object.entries(bySource).map(([src, rows]) => {
    const conf = rows[0]?.confidence ? parseFloat(rows[0].confidence) : null;
    const confPct = conf != null ? Math.round(conf * 100) : null;
    const bg = sourceBg(src);
    return `
      <div class="mb-6">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-sm font-bold text-gray-700">${escHtml(src)}</span>
          ${conf != null ? `
            <div class="flex items-center gap-2">
              <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-full bg-green-400 rounded-full conf-bar" style="width:${confPct}%"></div>
              </div>
              <span class="text-xs text-green-600 font-medium">conf ${conf.toFixed(3)}</span>
            </div>` : ''}
          <span class="text-xs text-gray-400">${rows.length} прогнозов</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
          ${rows.map(item => renderFcCard(item, bg)).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderFcCard(item, bg) {
  const dirColor = item.direction === 'NEGATIVE' ? 'text-red-500' : 'text-green-600';
  const dirIcon  = item.direction === 'NEGATIVE' ? '↓' : '↑';
  return `
    <div class="card border rounded-lg p-3 ${bg}">
      <div class="flex items-start justify-between gap-2 mb-1.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${domainBadge(item.domain)}
          ${item.techFamily ? `<span class="text-xs text-gray-500 bg-white px-1.5 py-0.5 rounded border border-gray-200">${escHtml(item.techFamily)}</span>` : ''}
        </div>
        <span class="text-xs font-bold ${dirColor} flex-shrink-0">${dirIcon} ${escHtml(item.direction||'')}</span>
      </div>
      <div class="mt-1.5 font-medium text-sm text-gray-800 leading-snug">
        ${escHtml(item.canonicalName || item.techFamily || (item.domain ? 'Домен: ' + item.domain : 'Skill #' + (item.canonicalId||'?')))}
      </div>
      <div class="flex items-center gap-1.5 mt-1 flex-wrap">
        ${item.professionCode ? `<span class="text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">${escHtml(item.professionCode)}</span>` : ''}
        ${item.forecastDate ? `<span class="text-xs text-gray-400">${escHtml(item.forecastDate)}</span>` : ''}
      </div>
      ${item.sourceUrl ? `<div class="mt-1"><a href="${escHtml(item.sourceUrl)}" target="_blank" class="text-xs text-blue-500 hover:underline truncate block">${escHtml(item.sourceUrl)}</a></div>` : ''}
    </div>
  `;
}

// ── Render Expert Opinions ────────────────────────────────────
function renderExpert(items) {
  if (!items.length) {
    document.getElementById('content').innerHTML = '<div class="text-center py-16 text-gray-400">Нет записей</div>';
    return;
  }

  // Group by expertId
  const byExpert = {};
  for (const item of items) {
    const key = item.expertId != null ? `Эксперт #${item.expertId}` : 'Без эксперта';
    if (!byExpert[key]) byExpert[key] = [];
    byExpert[key].push(item);
  }

  document.getElementById('content').innerHTML = Object.entries(byExpert).map(([expert, rows]) => {
    const avgImp = rows.reduce((s,r) => s + (r.skillImportance||0), 0) / rows.length;
    return `
      <div class="mb-6">
        <div class="flex items-center gap-3 mb-2">
          <span class="text-sm font-bold text-gray-700">${escHtml(expert)}</span>
          <div class="flex items-center gap-2">
            <div class="w-24 h-2 bg-gray-200 rounded-full overflow-hidden">
              <div class="h-full bg-blue-400 rounded-full conf-bar" style="width:${Math.round(avgImp*100)}%"></div>
            </div>
            <span class="text-xs text-blue-600 font-medium">avg imp ${avgImp.toFixed(3)}</span>
          </div>
          <span class="text-xs text-gray-400">${rows.length} мнений</span>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-2">
          ${rows.map(renderExpCard).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderExpCard(item) {
  const imp = item.skillImportance != null ? item.skillImportance : 0;
  const impPct = Math.round(imp * 100);
  const impColor = imp >= 0.7 ? 'bg-green-400' : imp >= 0.4 ? 'bg-yellow-400' : 'bg-red-400';
  const dirColor = item.direction === 'NEGATIVE' ? 'text-red-500' : 'text-green-600';
  const dirIcon  = item.direction === 'NEGATIVE' ? '↓' : '↑';
  return `
    <div class="card border border-gray-200 rounded-lg p-3 bg-white">
      <div class="flex items-start justify-between gap-2 mb-2">
        <div class="flex items-center gap-1.5 flex-wrap">
          ${domainBadge(item.domain)}
          ${item.techFamily ? `<span class="text-xs text-gray-500 bg-gray-50 px-1.5 py-0.5 rounded border border-gray-200">${escHtml(item.techFamily)}</span>` : ''}
        </div>
        <span class="text-xs font-bold ${dirColor} flex-shrink-0">${dirIcon} ${escHtml(item.direction||'')}</span>
      </div>
      <div class="mt-1 font-medium text-sm text-gray-800 leading-snug">
        ${escHtml(item.canonicalName || item.techFamily || (item.domain ? 'Домен: ' + item.domain : 'Skill #' + (item.canonicalId||'?')))}
      </div>
      <div class="flex items-center gap-2 mt-1.5">
        <span class="text-xs text-gray-400">важность:</span>
        <div class="w-16 h-1.5 bg-gray-100 rounded-full overflow-hidden">
          <div class="h-full ${impColor} rounded-full" style="width:${impPct}%"></div>
        </div>
        <span class="text-xs font-mono font-medium">${imp.toFixed(3)}</span>
        ${item.professionCode ? `<span class="ml-1 text-xs text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded">${escHtml(item.professionCode)}</span>` : ''}
      </div>
    </div>
  `;
}

// ── Filters wiring ────────────────────────────────────────────
document.getElementById('filter-input').addEventListener('input', applyFilters);
document.getElementById('filter-domain').addEventListener('change', applyFilters);
document.getElementById('filter-direction').addEventListener('change', applyFilters);

// ── Init ──────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
